<!-- Syntax of html File -->

<!-- Open Tags -->
<html>
  <head>
    <title>My First Page</title>
  </head>

  <body>
    <h1>Content</h1>
  <!--  <h1>My Name is Vinayak.</h1> -->

    <h2>Heading 2</h2>
    <h3>Heading 2</h3>
  </body>

  <!-- Close Tag -->
</html>

<!-- 

Html :-  it is the root of our htmlFile.
head :- it stores the meta information.
title:- title of our WebPage.
body :- Make Content which show into the html File.

Content :- Text or files(Image,Videos)

Headings :- 6 types of headings
. Descending order in H1 to H6 in size.
. Importance :- H1 is more important as compare to another.

-->
