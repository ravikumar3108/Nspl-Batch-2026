<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Model</title>

    <style>
      /* 
        content :- text or files
        border :- a line around the content.
        padding :- a space between the content and the border
        margin :- a space between border and the outer elements.
        
        */

      h1 {
        border: 1px solid red;
        /* padding-left: 50px; */
        /* padding-top: 20px; */

        /* Four sides */
        padding: 40px;
        /* 1st :- top/bottom , 2nd :- left/right  */
        padding: 10px 20px;
        /* 1st :- top , 2nd :- left/right , 3rd :- bottom */
        padding: 10px 20px 30px;
        /* 1st :- top , 2nd :- right , 3rd :- bottom , 4th :- left */
        padding: 10px 20px 30px 40px;

        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <h2>helooo</h2>
    <h1>Heloo my name is Vinayak</h1>
  </body>
</html>
