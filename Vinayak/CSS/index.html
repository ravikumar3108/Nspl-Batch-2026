<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 
        CSS :- Cascadic style sheet

        3 Types :-
        1. Inline Css :- apply into the all the tags by the style attribute.

        syntax :- style = "propertyname : property value;"

        2. Internal Css :- Apply into the head and body by the help of style tag.
        3. External css :- apply by the external file.
    
    -->

    <h1 style="color: red; background-color: green">Vinayak</h1>
  </body>
</html>
