<!-- 
 
Html :- Hypertext markup language.

it is used to create a web page/ web application. it is group of tags.

content :- text or files(audio,video,images)

extension :- .html

-->

<!-- Syntax of Html File :-  -->

<html>
  <head>
    <title>My First Page</title>
  </head>

  <body>
    <h1>Kishan Singh</h1>
  </body>
</html>

<!-- 

Html :- Roots of our web page.
head :- it is used to store meta information of our web page.
title :- Title of our web page.
body :- content.

-->
