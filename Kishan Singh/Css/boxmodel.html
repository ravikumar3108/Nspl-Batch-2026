<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      h1 {
        border: 1px solid black;
        /* Four sides */
        padding: 20px;
        /* 1. top or bottom   2. left or right */
        padding: 20px 30px;
        /* 1. top  2.left or right 3. bottom */
        padding: 10px 20px 30px;
        /* Clockwise :- top , right , bottom , left */
        padding: 10px 20px 30px 40px;
        padding-top: 100px;

        margin-left: 100px;
        margin-top: 200px;



      }
    </style>
  </head>
  <body>
    <!-- 
        content :- text / files
        border :- a line around our content
        padding :- a space between our border and content.
        margin :- a space btw our border and outer element. a space around our element.
    -->

    <h1>Heloo Kishan</h1>
  </body>
</html>
