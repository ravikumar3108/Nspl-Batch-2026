<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 
    CSS :- Cascadic Style Sheet :- it is used to design our webpage.

    1.Inline Css :- which is apply by the style Attribute.
    2. Internal Css :- Which is apply by the Style Tag in the head / body.
    3. External Css :- Which is apply by the external file.

    extension :- .css

    {propertyname : propertyvalue ;}

-->
    <!-- 
        color :- colorname , rgb(red, green,blue)(0,255) value, hexadecimal value

        -->
    <h1 style="color: rgb(53, 235, 29); background-color: green">My name is Kishan</h1>
    <h1 style="color: #15370D; background-color: green">My name is Kishan</h1>
  </body>
</html>
