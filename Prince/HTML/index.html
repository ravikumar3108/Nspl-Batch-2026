<!-- 
    Html Comments
    Extension :- .html

    HTML :- Hyper text markup language.
    it is a group of tags. 
    content :- text or files(media , images)

    open tag : <name>
    close tag : </name>
    self close : <name/>

    HTML File Syntax :- 

    <!DOCTYPE html> 
    <html lang="en">
     <head>
    <title>Document</title>
     </head>
     <body>
    
     </body>
     </html>


      <!DOCTYPE html> :- Document type Html file
      html :- Root of our webpage.
      head :- Store Meta information
      title :- title of our webpage. 
      body :- content

-->

<!doctype html>
<html>

     <head>
        <title>Page</title>
     </head>

     <body>
        
        
     </body>

</html>
